server {
  listen 80;
  server_name _;

  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  root /usr/share/nginx/html;
  index index.html;

  include /etc/nginx/security-headers.conf;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/plain text/css text/javascript application/javascript
             application/json application/x-javascript text/xml
             application/xml application/xml+rss image/svg+xml;

  # Resolve the project-scoped API alias through Docker DNS at request time.
  # Using a variable prevents admin Nginx from failing startup during a rolling
  # API replacement, while keeping authentication traffic off the public edge.
  # Keep Docker DNS caching short enough for rolling container replacement.
  # A 30-second stale API address previously produced avoidable 503s after an
  # otherwise healthy deployment.
  resolver 127.0.0.11 valid=5s ipv6=off;
  resolver_timeout 2s;

  location /api/ {
    set $cgm_api_upstream http://claudygod-mobile-api:4000;
    # The browser calls /api/v1/*; the API itself owns /v1/*. Make the prefix
    # removal explicit because proxy_pass URI replacement is ambiguous when
    # the upstream is held in a variable.
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $cgm_api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Claudy-Client-Platform web;
    proxy_connect_timeout 3s;
    proxy_send_timeout 15s;
    proxy_read_timeout 15s;
    proxy_buffering off;
    proxy_intercept_errors on;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 3;
    error_page 502 503 504 = @api_unavailable;
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-store" always;
  }

  # Never leak Nginx/Cloudflare HTML into the application. More importantly,
  # every failed upstream request now has a bounded JSON response and request
  # semantics that the shared API client can handle consistently.
  location @api_unavailable {
    internal;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 503 '{"error":"The requested service is unavailable. Please try again shortly.","message":"The requested service is unavailable. Please try again shortly.","code":"SERVICE_UNAVAILABLE"}';
  }

  location = /health {
    include /etc/nginx/security-headers.conf;
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  # Never cache the HTML entry point — stale HTML causes ERR_CONNECTION_CLOSED
  # because the browser asks for chunk hashes that no longer exist after a redeploy.
  location = /index.html {
    include /etc/nginx/security-headers.conf;
    # no-transform prevents edge services from injecting scripts into the
    # authenticated application shell and invalidating its strict CSP.
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, no-transform" always;
    add_header Pragma "no-cache" always;
    expires -1;
    try_files $uri =404;
  }

  # Vite hashes every asset filename — these are immutable and safe to cache forever.
  location /assets/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Brand / static files — cache for 1 day
  location /brand/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=86400" always;
    try_files $uri =404;
  }

  # SPA fallback — every unknown path serves index.html so the Vue router handles it.
  location / {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, no-transform" always;
    try_files $uri $uri/ /index.html;
  }

}
