server {
  listen 80;
  server_name _;

  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  root /usr/share/nginx/html;
  index index.html;

  include /etc/nginx/security-headers.conf;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/plain text/css text/javascript application/javascript
             application/json application/x-javascript text/xml
             application/xml application/xml+rss image/svg+xml;

  location = /health {
    include /etc/nginx/security-headers.conf;
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  # Never cache the HTML entry point — stale HTML causes ERR_CONNECTION_CLOSED
  # because the browser asks for chunk hashes that no longer exist after a redeploy.
  location = /index.html {
    include /etc/nginx/security-headers.conf;
    # no-transform prevents edge services from injecting scripts into the
    # authenticated application shell and invalidating its strict CSP.
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, no-transform" always;
    add_header Pragma "no-cache" always;
    expires -1;
    try_files $uri =404;
  }

  # Vite hashes every asset filename — these are immutable and safe to cache forever.
  location /assets/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Brand / static files — cache for 1 day
  location /brand/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=86400" always;
    try_files $uri =404;
  }

  # SPA fallback — every unknown path serves index.html so the Vue router handles it.
  location / {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, no-transform" always;
    try_files $uri $uri/ /index.html;
  }

}
