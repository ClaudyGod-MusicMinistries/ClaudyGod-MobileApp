name: Mobile Store Release Candidate

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Store platform to build
        required: true
        type: choice
        options: [all, ios, android]
        default: all

concurrency:
  group: mobile-store-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  certify-and-build:
    name: Certify and start EAS production build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: mobile-store-production
    env:
      CLAUDYGOD_ENV: production
      NODE_ENV: production
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || secrets.EXPO_PUBLIC_API_URL }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL || secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_KEY || secrets.EXPO_PUBLIC_SUPABASE_KEY }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_KEY || secrets.EXPO_PUBLIC_SUPABASE_KEY }}
      EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID || secrets.EAS_PROJECT_ID }}
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID || secrets.EAS_PROJECT_ID }}
      EXPO_PUBLIC_SENTRY_DSN: ${{ vars.EXPO_PUBLIC_SENTRY_DSN || secrets.EXPO_PUBLIC_SENTRY_DSN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Enable Yarn Classic
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Verify store credentials
        run: |
          set -euo pipefail
          for name in EXPO_TOKEN EXPO_PUBLIC_API_URL EXPO_PUBLIC_SUPABASE_URL EXPO_PUBLIC_SUPABASE_KEY EXPO_PUBLIC_EAS_PROJECT_ID EXPO_PUBLIC_SENTRY_DSN; do
            value="${!name:-}"
            if [ -z "$value" ] || printf '%s' "$value" | grep -Eqi 'placeholder|your_|example|validation'; then
              echo "::error::$name is missing or contains a placeholder"
              exit 1
            fi
          done

      - name: Install mobile dependencies
        run: yarn --cwd ./apps/mobile install --frozen-lockfile

      - name: Run mobile quality and architecture gates
        run: |
          yarn --cwd ./apps/mobile typecheck
          yarn --cwd ./apps/mobile lint:strict
          yarn --cwd ./apps/mobile test
          yarn contracts:check

      - name: Certify store evidence and production manifest
        run: yarn --cwd ./apps/mobile release:certify

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Start immutable production build
        working-directory: apps/mobile
        run: eas build --platform "${{ inputs.platform }}" --profile production --non-interactive --no-wait
