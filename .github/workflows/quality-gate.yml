name: Quality Gate

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

concurrency:
  group: quality-gate-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CI: 'true'
  CI_DATABASE_URL:              ${{ secrets.CI_DATABASE_URL }}
  CI_SUPABASE_URL:              ${{ secrets.CI_SUPABASE_URL }}
  CI_SUPABASE_PUBLISHABLE_KEY:  ${{ secrets.CI_SUPABASE_PUBLISHABLE_KEY }}
  CI_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.CI_SUPABASE_SERVICE_ROLE_KEY }}
  CI_YOUTUBE_API_KEY:           ${{ secrets.CI_YOUTUBE_API_KEY }}
  CI_YOUTUBE_CHANNEL_ID:        ${{ secrets.CI_YOUTUBE_CHANNEL_ID }}
  CI_POSTFIX_SMTP_USERNAME:     ${{ secrets.CI_POSTFIX_SMTP_USERNAME }}
  CI_POSTFIX_SMTP_PASSWORD:     ${{ secrets.CI_POSTFIX_SMTP_PASSWORD }}

jobs:
  verify:
    name: Verify repository
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - name: Set up approved Node and Yarn toolchain
        run: bash ./scripts/setup-node-ci.sh

      - name: Create CI environment files
        run: bash ./scripts/setup-ci-env.sh

      - name: Install locked dependencies
        run: |
          set -euo pipefail
          yarn_install_with_retry() {
            local dir="$1"
            local max_attempts=4
            local attempt=1
            until yarn --cwd "$dir" install --frozen-lockfile --network-timeout 300000 --network-retries 5; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "::error::Failed to install dependencies in $dir after $max_attempts attempts."
                return 1
              fi
              echo "Network failure (e.g. 502 Bad Gateway) during yarn install in $dir. Retrying in 10s ($attempt/$max_attempts)..."
              sleep 10
              attempt=$((attempt + 1))
            done
          }

          yarn_install_with_retry ./services/api
          yarn_install_with_retry ./admin/web
          yarn_install_with_retry ./apps/mobile

      - name: Run repository quality, security, and deployment contracts
        run: bash ./scripts/prepush-all-checks.sh

      - name: Install Playwright Chromium
        run: yarn --cwd ./admin/web playwright install --with-deps chromium

      - name: Run admin browser workflows
        run: yarn --cwd ./admin/web test:e2e
