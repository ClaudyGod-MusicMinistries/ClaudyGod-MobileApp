name: Deploy to Production

# Only deploy on push to main or manual trigger — never on PRs
on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false   # never cancel an in-flight deploy

permissions:
  contents: read
  packages: write             # push images to GHCR

env:
  CI:         'true'
  GHCR_OWNER: claudygod-musicministries
  REGISTRY:   ghcr.io/claudygod-musicministries
  CI_DATABASE_URL:               ${{ secrets.CI_DATABASE_URL }}
  CI_SUPABASE_URL:               ${{ secrets.CI_SUPABASE_URL }}
  CI_SUPABASE_PUBLISHABLE_KEY:   ${{ secrets.CI_SUPABASE_PUBLISHABLE_KEY }}
  CI_SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.CI_SUPABASE_SERVICE_ROLE_KEY }}
  CI_YOUTUBE_API_KEY:            ${{ secrets.CI_YOUTUBE_API_KEY }}
  CI_YOUTUBE_CHANNEL_ID:         ${{ secrets.CI_YOUTUBE_CHANNEL_ID }}
  CI_POSTFIX_SMTP_USERNAME:      ${{ secrets.CI_POSTFIX_SMTP_USERNAME }}
  CI_POSTFIX_SMTP_PASSWORD:      ${{ secrets.CI_POSTFIX_SMTP_PASSWORD }}

jobs:
  # The same reusable gate protects develop/PRs and production. There is one
  # implementation and main does not trigger a second, duplicate workflow.
  quality:
    name: Quality Gate
    uses: ./.github/workflows/quality-gate.yml
    secrets: inherit

  # ── 1. Build all Docker images and push to GHCR ──────────────────────────────
  build-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - name: Verify production public build configuration
        env:
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN || secrets.VITE_SENTRY_DSN }}
          VITE_MOBILE_PREVIEW_URL: ${{ vars.VITE_MOBILE_PREVIEW_URL || secrets.VITE_MOBILE_PREVIEW_URL }}
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || secrets.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL || secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_KEY || secrets.EXPO_PUBLIC_SUPABASE_KEY }}
          EXPO_PUBLIC_SENTRY_DSN: ${{ vars.EXPO_PUBLIC_SENTRY_DSN || secrets.EXPO_PUBLIC_SENTRY_DSN }}
          EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID || secrets.EAS_PROJECT_ID }}
        run: |
          set -euo pipefail
          for name in VITE_SENTRY_DSN VITE_MOBILE_PREVIEW_URL EXPO_PUBLIC_API_URL EXPO_PUBLIC_SUPABASE_URL EXPO_PUBLIC_SUPABASE_KEY EXPO_PUBLIC_SENTRY_DSN EAS_PROJECT_ID; do
            value="${!name:-}"
            if [ -z "$value" ] || printf '%s' "$value" | grep -Eqi 'placeholder|your_|example|validation'; then
              echo "::error::$name is missing or contains a placeholder"
              exit 1
            fi
          done
          for name in VITE_SENTRY_DSN VITE_MOBILE_PREVIEW_URL EXPO_PUBLIC_API_URL EXPO_PUBLIC_SUPABASE_URL EXPO_PUBLIC_SENTRY_DSN; do
            value="${!name}"
            case "$value" in https://*) ;; *) echo "::error::$name must use HTTPS"; exit 1;; esac
          done

      - name: Create CI environment files
        run: bash ./scripts/setup-ci-env.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # API image (shared by api, worker, migrate containers)
      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context:    ./services/api
          file:       ./services/api/Dockerfile
          platforms:  linux/amd64
          push:       true
          tags: |
            ghcr.io/${{ env.GHCR_OWNER }}/claudygod-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to:   type=gha,scope=api,mode=max

      # Postfix relay
      - name: Build and push Postfix image
        uses: docker/build-push-action@v7
        with:
          context:    ./ops/postfix
          platforms:  linux/amd64
          push:       true
          tags: |
            ghcr.io/${{ env.GHCR_OWNER }}/claudygod-postfix:${{ github.sha }}
          cache-from: type=gha,scope=postfix
          cache-to:   type=gha,scope=postfix,mode=max

      # Admin web — VITE vars baked in at build time (use GitHub Variables for these)
      - name: Build and push admin-web image
        uses: docker/build-push-action@v7
        with:
          context:    ./admin/web
          file:       ./admin/web/Dockerfile
          platforms:  linux/amd64
          push:       true
          build-args: |
            VITE_API_URL=/api
            VITE_GOOGLE_LOGIN_URL=${{ vars.VITE_GOOGLE_LOGIN_URL || secrets.VITE_GOOGLE_LOGIN_URL }}
            VITE_MOBILE_PREVIEW_URL=${{ vars.VITE_MOBILE_PREVIEW_URL || secrets.VITE_MOBILE_PREVIEW_URL }}
            VITE_SENTRY_DSN=${{ vars.VITE_SENTRY_DSN || secrets.VITE_SENTRY_DSN }}
          tags: |
            ghcr.io/${{ env.GHCR_OWNER }}/claudygod-admin:${{ github.sha }}
          cache-from: type=gha,scope=admin
          cache-to:   type=gha,scope=admin,mode=max

      # Mobile web — EXPO_PUBLIC vars baked in at build time
      - name: Build and push mobile-web image
        uses: docker/build-push-action@v7
        with:
          context:    ./apps/mobile
          file:       ./apps/mobile/Dockerfile.prod
          platforms:  linux/amd64
          push:       true
          build-args: |
            EXPO_PUBLIC_API_URL=/api
            EXPO_PUBLIC_SUPABASE_URL=${{ vars.EXPO_PUBLIC_SUPABASE_URL || secrets.EXPO_PUBLIC_SUPABASE_URL }}
            EXPO_PUBLIC_SUPABASE_KEY=${{ vars.EXPO_PUBLIC_SUPABASE_KEY || secrets.EXPO_PUBLIC_SUPABASE_KEY }}
            EAS_PROJECT_ID=${{ vars.EAS_PROJECT_ID || secrets.EAS_PROJECT_ID }}
            EXPO_PUBLIC_SENTRY_DSN=${{ vars.EXPO_PUBLIC_SENTRY_DSN || secrets.EXPO_PUBLIC_SENTRY_DSN }}
          tags: |
            ghcr.io/${{ env.GHCR_OWNER }}/claudygod-mobile:${{ github.sha }}
          cache-from: type=gha,scope=mobile
          cache-to:   type=gha,scope=mobile,mode=max

  # ── 2. Deploy — SSH into the VPS and run `make deploy` (pull → migrate → up --wait) ─
  #
  # This mirrors the deploy job that was already tested against production (see git
  # history: commit 630a34b onward) rather than reinventing the mechanism. The VPS holds
  # its own git clone of this repo at VPS_DEPLOY_PATH; `git pull` brings its
  # docker-compose.production.yml and Makefile up to date, then `make deploy` (defined
  # in the repo's own Makefile) does the actual pull/migrate/rollout via
  # `docker compose ... up -d --wait`, which already blocks on and fails on unhealthy
  # containers — no separate polling step needed here.
  #
  # Required GitHub repo configuration (Settings → Secrets and variables → Actions):
  #   Secrets:
  #     VPS_HOST            — VPS hostname or IP
  #     VPS_USER            — SSH user with docker + git permissions on the VPS
  #     VPS_SSH_KEY         — private key for that user, pasted as plain multi-line text
  #                           (`cat deploy_key`) — appleboy/ssh-action's `key:` input
  #                           accepts this directly, no encoding needed
  #     VPS_PORT            — SSH port
  #     VPS_DEPLOY_PATH     — absolute path to the repo's git clone on the VPS,
  #                           containing the real .env.production (e.g. /opt/claudygod)
  #     GHCR_DEPLOY_TOKEN   — GitHub PAT with `read:packages`, used by the VPS to
  #                           `docker login ghcr.io` (only needed while GHCR packages
  #                           are private)
  #   Variables:
  #     API_DOMAIN          — apimobile.claudygod.org (matches VITE_API_URL /
  #                           EXPO_PUBLIC_API_URL used by the production build;
  #                           used here for the post-deploy health check)
  #
  # This job never creates or touches .env.production on the server — that file holds
  # real production secrets and is managed by whoever operates the VPS, once, out of
  # band. `scripts/setup-ci-env.sh` (used by the `quality`/`build-push` jobs above) only
  # ever writes a CI-local file for running tests; it has no path to the server at all.
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build-push
    timeout-minutes: 20
    environment:
      name: production
      url: https://${{ vars.API_DOMAIN }}

    steps:
      # Fail fast with a clear message if deployment isn't configured yet, instead of
      # letting missing secrets silently interpolate to "" and produce a cryptic
      # ssh failure downstream.
      - name: Verify deployment secrets are configured
        run: |
          missing=""
          [ -z "${{ secrets.VPS_HOST }}" ]          && missing="$missing VPS_HOST"
          [ -z "${{ secrets.VPS_USER }}" ]          && missing="$missing VPS_USER"
          [ -z "${{ secrets.VPS_SSH_KEY }}" ]       && missing="$missing VPS_SSH_KEY"
          [ -z "${{ secrets.VPS_PORT }}" ]          && missing="$missing VPS_PORT"
          [ -z "${{ secrets.VPS_DEPLOY_PATH }}" ]   && missing="$missing VPS_DEPLOY_PATH"
          [ -z "${{ secrets.GHCR_DEPLOY_TOKEN }}" ] && missing="$missing GHCR_DEPLOY_TOKEN"
          [ -z "${{ vars.API_DOMAIN }}" ]           && missing="$missing API_DOMAIN(variable)"

          if [ -n "$missing" ]; then
            echo "::error::Deployment is not configured yet — missing:$missing"
            echo "Add these under Settings → Secrets and variables → Actions (all are Secrets except API_DOMAIN, which is a Variable)."
            exit 1
          fi
          echo "All required deployment secrets/variables are present."

      - name: Validate SSH private key material
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KEY_PASSPHRASE: ${{ secrets.VPS_SSH_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail
          key_file="${RUNNER_TEMP}/claudygod-deploy-key"
          public_key_file="${key_file}.pub"
          trap 'rm -f "$key_file" "$public_key_file"' EXIT
          printf '%s\n' "$VPS_SSH_KEY" > "$key_file"
          chmod 600 "$key_file"

          if ! head -n 1 "$key_file" | grep -Eq '^-----BEGIN (OPENSSH|RSA|EC|DSA) PRIVATE KEY-----$'; then
            echo "::error::VPS_SSH_KEY is not plain OpenSSH private-key text. Store the private key, not the .pub key, path, or base64 wrapper."
            exit 1
          fi
          if ! ssh-keygen -y -P "$VPS_SSH_KEY_PASSPHRASE" -f "$key_file" > "$public_key_file"; then
            echo "::error::VPS_SSH_KEY could not be decrypted. Replace it with a valid private key or configure VPS_SSH_KEY_PASSPHRASE."
            exit 1
          fi
          echo "Deploy public-key fingerprint: $(ssh-keygen -lf "$public_key_file" | awk '{print $2}')"

      # appleboy/ssh-action accepts the private key directly via `key:` and handles
      # writing it to disk internally — no manual decode step, no encoding convention
      # for anyone to get wrong on the next rotation. Paste VPS_SSH_KEY as the plain
      # multi-line key text (`cat your_key`), nothing else. This replaces an earlier
      # hand-rolled base64-decode step that kept breaking on re-rotation — the decode
      # step was never necessary, it was solving a problem this action already solves.
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          GHCR_DEPLOY_TOKEN: ${{ secrets.GHCR_DEPLOY_TOKEN }}
          DEPLOY_SHA:        ${{ github.sha }}
          API_DOMAIN:        ${{ vars.API_DOMAIN }}
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_KEY_PASSPHRASE }}
          port:     ${{ secrets.VPS_PORT }}
          envs:     GHCR_DEPLOY_TOKEN,DEPLOY_SHA,API_DOMAIN
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.VPS_DEPLOY_PATH }}"

            if [ ! -f .env.production ]; then
              echo "::error::.env.production is missing at ${{ secrets.VPS_DEPLOY_PATH }} — refusing to deploy without real secrets."
              exit 1
            fi

            # `docker compose ps` still interpolates the complete file. Supply
            # the immutable candidate SHA even though this command only reads
            # the currently running container.
            previous_container=$(IMAGE_TAG="$DEPLOY_SHA" docker compose -f docker-compose.production.yml --env-file .env.production ps -q cgm-api)
            previous_tag=""
            if [ -n "$previous_container" ]; then
              previous_image=$(docker inspect --format '{{.Config.Image}}' "$previous_container")
              previous_tag=${previous_image##*:}
            fi

            rollback_previous_release() {
              echo "Candidate release diagnostics:"
              IMAGE_TAG="$DEPLOY_SHA" docker compose -f docker-compose.production.yml --env-file .env.production ps || true
              IMAGE_TAG="$DEPLOY_SHA" docker compose -f docker-compose.production.yml --env-file .env.production logs --tail=120 cgm-api worker redis admin-web || true
              if printf '%s' "$previous_tag" | grep -Eq '^[0-9a-f]{40}$'; then
                echo "Deployment verification failed; restoring immutable release $previous_tag"
                IMAGE_TAG="$previous_tag" make rollback SHA="$previous_tag"
              else
                echo "::error::No immutable previous release SHA was available for automatic rollback."
              fi
            }

            # Deploy the immutable workflow revision, not a merge result from a
            # mutable branch. A dirty deployment checkout is an operational
            # error and checkout will refuse to overwrite it.
            git fetch --prune origin main
            git checkout --detach "$DEPLOY_SHA"
            echo "$GHCR_DEPLOY_TOKEN" | docker login ghcr.io -u peter4tech --password-stdin

            if ! IMAGE_TAG="$DEPLOY_SHA" make deploy; then
              rollback_previous_release
              exit 1
            fi

            verify_release_integrity() {
              expected_suffix=":$DEPLOY_SHA"

              for service in cgm-api worker admin-web mobile-web; do
                container_id=$(IMAGE_TAG="$DEPLOY_SHA" docker compose -f docker-compose.production.yml --env-file .env.production ps -q "$service")
                if [ -z "$container_id" ]; then
                  echo "::error::$service has no running container"
                  return 1
                fi
                running_image=$(docker inspect --format '{{.Config.Image}}' "$container_id")
                case "$running_image" in
                  *"$expected_suffix") ;;
                  *)
                    echo "::error::$service is running $running_image, expected immutable release $DEPLOY_SHA"
                    return 1
                    ;;
                esac
                health=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' "$container_id")
                if [ "$health" != "healthy" ]; then
                  echo "::error::$service health is $health, expected healthy"
                  return 1
                fi
              done

              admin_container=$(IMAGE_TAG="$DEPLOY_SHA" docker compose -f docker-compose.production.yml --env-file .env.production ps -q admin-web)
              if docker exec "$admin_container" grep -Rqs 'https://apimobile\.claudygod\.org' /usr/share/nginx/html; then
                echo "::error::Admin bundle contains the retired cross-origin API endpoint"
                return 1
              fi

              admin_domain=$(sed -n 's/^ADMIN_DOMAIN=//p' .env.production | tail -n 1 | tr -d '\r"' | tr -d "'")
              app_domain=$(sed -n 's/^APP_DOMAIN=//p' .env.production | tail -n 1 | tr -d '\r"' | tr -d "'")
              if [ -z "$admin_domain" ] || [ -z "$app_domain" ]; then
                echo "::error::ADMIN_DOMAIN and APP_DOMAIN must be configured in .env.production"
                return 1
              fi

              for gateway in "https://$admin_domain/api/health" "https://$app_domain/api/health"; do
                gateway_ready=false
                for i in $(seq 1 10); do
                  status=$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 4 --max-time 10 "$gateway" || true)
                  if [ "$status" = "200" ]; then
                    gateway_ready=true
                    break
                  fi
                  echo "Same-origin gateway $gateway returned ${status:-network-error}, retrying ($i/10)..."
                  sleep 3
                done
                if [ "$gateway_ready" != "true" ]; then
                  echo "::error::Same-origin gateway failed: $gateway"
                  return 1
                fi
              done
            }

            if ! verify_release_integrity; then
              rollback_previous_release
              exit 1
            fi

            if ! IMAGE_TAG="$DEPLOY_SHA" make certify-integrations; then
              rollback_previous_release
              exit 1
            fi

            public_ready=false
            for i in $(seq 1 10); do
              status=$(curl -s -o /dev/null -w '%{http_code}' "https://$API_DOMAIN/health" || echo "000")
              if [ "$status" = "200" ]; then
                public_ready=true
                break
              fi
              echo "Public health check returned $status, retrying ($i/10)..."
              sleep 6
            done
            if [ "$public_ready" != "true" ]; then
              rollback_previous_release
              exit 1
            fi

            docker image prune -f

      # Independent confirmation from the Actions runner. The transactional
      # server-side probe above already rolls back before this step can run.
      - name: Verify public API endpoint
        run: |
          for i in $(seq 1 10); do
            status=$(curl -s -o /dev/null -w '%{http_code}' "https://${{ vars.API_DOMAIN }}/health" || echo "000")
            if [ "$status" = "200" ]; then
              echo "API is reachable and healthy at https://${{ vars.API_DOMAIN }}/health"
              exit 0
            fi
            echo "Public health check returned $status, retrying ($i/10)..."
            sleep 6
          done
          echo "::error::API did not respond healthy at https://${{ vars.API_DOMAIN }}/health after deploy."
          exit 1
