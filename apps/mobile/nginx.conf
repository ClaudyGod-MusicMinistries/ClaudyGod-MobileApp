server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Browser clients use a same-origin API gateway. The native iOS/Android
  # builds continue to call the public HTTPS API configured by EAS.
  resolver 127.0.0.11 valid=30s ipv6=off;

  location /api/ {
    set $cgm_api_upstream http://claudygod-mobile-api:4000;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $cgm_api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Claudy-Client-Platform web;
    proxy_connect_timeout 3s;
    proxy_send_timeout 15s;
    proxy_read_timeout 15s;
    proxy_buffering off;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  # Expo fingerprints production assets. Long-lived immutable caching removes
  # repeat downloads of icon fonts and JavaScript chunks on subsequent starts.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, no-transform" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, no-transform" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri $uri/ /index.html;
  }

  add_header X-Content-Type-Options "nosniff" always;
  add_header Content-Security-Policy "frame-ancestors 'self' https://mobileadmin.claudygod.org https://admin.claudygod.org https://app.claudygod.org https://mobileapp.claudygod.org" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
